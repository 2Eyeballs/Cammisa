name: Fetch Substack Posts

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:       # allow manual trigger from GitHub UI

concurrency:
  group: fetch-substack-posts
  cancel-in-progress: true

jobs:
  fetch-posts:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch RSS and save posts.json
        run: |
          set -euo pipefail

          fetch_ok=0
          fetch_format="rss"
          
          # RSSHub acts as a trusted proxy to bypass Substack's anti-bot protection
          # It caches the feed and allows programmatic access
          echo "Fetching from RSSHub (trusted RSS aggregator)..."
          
          for url in \
            "https://rsshub.app/substack/cammisabuerhaus" \
            "https://cammisabuerhaus.substack.com/feed" \
            "https://cammisabuerhaus.substack.com/feed?output=rss"
          do
            echo "Attempting feed URL: $url"
            http_code=$(curl -sS -L \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 90 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Accept: application/rss+xml, application/xml, text/xml, application/json" \
              -H "Accept-Language: en-US,en;q=0.9" \
              -H "Connection: keep-alive" \
              --compressed \
              -o feed.xml \
              -w "%{http_code}" \
              "$url" 2>&1 || true)

            if [[ "$http_code" == "200" ]] && [[ -s feed.xml ]]; then
              fetch_ok=1
              fetch_format="rss"
              echo "✓ Feed fetch succeeded from $url (HTTP $http_code)"
              break
            else
              echo "Feed fetch failed from $url (HTTP ${http_code:-unknown})"
            fi
          done

          if [[ "$fetch_ok" -ne 1 ]]; then
            echo "⚠ All feed sources unavailable (Substack blocking + RSSHub down)"
            echo "Keeping existing posts.json..."
            if [[ ! -f posts.json ]]; then
              echo "Creating minimal posts.json as fallback"
              echo '{"items": []}' > posts.json
            else
              echo "Existing posts.json retained"
            fi
            exit 0
          fi

          export FETCH_FORMAT="$fetch_format"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from xml.etree import ElementTree as ET

          with open('feed.xml', 'r', encoding='utf-8') as f:
              data = f.read()

          if not data.strip():
              raise SystemExit('Empty RSS/JSON response; aborting to avoid stale posts.json')

          posts = []

          fetch_format = os.getenv('FETCH_FORMAT', 'rss')
          if fetch_format == 'json':
              raw_posts = json.loads(data)
              for item in raw_posts:
                  title = item.get('title') or ''
                  if title.startswith('[COPY]'):
                      continue
                  posts.append({
                      'title': title,
                      'link': item.get('canonical_url') or '',
                      'pubDate': item.get('post_date') or '',
                      'description': item.get('description') or '',
                      'content': item.get('body_html') or ''
                  })
          else:
              # RSS responses can occasionally include invalid XML control chars.
              # Strip only illegal XML 1.0 code points to avoid parser crashes.
              data = re.sub(
                  r'[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]',
                  '',
                  data,
                )

              try:
                  root = ET.fromstring(data)
              except ET.ParseError as exc:
                  raise SystemExit(f'RSS parse error; aborting to avoid stale posts.json: {exc}')

              ns = {'content': 'http://purl.org/rss/1.0/modules/content/'}
              items = root.findall('.//item')

              for item in items:
                  t = item.find('title')
                  l = item.find('link')
                  d = item.find('pubDate')
                  desc = item.find('description')
                  body = item.find('content:encoded', ns)

                  title = t.text if t is not None and t.text else ''
                  if title.startswith('[COPY]'):
                      continue

                  posts.append({
                      'title': title,
                      'link': l.text.strip() if l is not None and l.text else '',
                      'pubDate': d.text if d is not None and d.text else '',
                      'description': desc.text if desc is not None and desc.text else '',
                      'content': body.text if body is not None and body.text else ''
                  })

          if not posts:
              raise SystemExit('No valid posts parsed from RSS; refusing to overwrite posts.json')

          payload = {'items': posts}
          encoded = json.dumps(payload, ensure_ascii=False, indent=2)
          with open('posts.json', 'w', encoding='utf-8') as f:
              f.write(encoded)
              f.write('\n')

          digest = hashlib.sha256(encoded.encode('utf-8')).hexdigest()
          print(f'Parsed {len(posts)} post(s). sha256={digest}')
          for post in posts[:5]:
              print(f"- {post['title']}")
          PY

      - name: Verify generated JSON
        run: |
          python3 - <<'PY'
          import json
          with open('posts.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data, dict) and isinstance(data.get('items'), list)
          print('posts.json verified with', len(data['items']), 'item(s)')
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add posts.json
          if git diff --staged --quiet; then
            echo "No posts.json changes to commit"
            exit 0
          fi
          git commit -m "chore: update posts.json"
          git push origin HEAD
