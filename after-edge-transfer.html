<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Transfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        #root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        .Edge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .Edge--void {
            position: absolute;
            background: rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }
        
        .ImageSlider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            will-change: transform;
        }
        
        .ImageSlider--left {
            animation: slideFromLeft 20s ease-in-out infinite;
        }
        
        .ImageSlider--right {
            animation: slideFromRight 20s ease-in-out infinite;
        }
        
        .ImageSlider--left-top {
            z-index: 2;
        }
        
        .ImageSlider--right-top {
            z-index: 2;
        }
        
        .ImageSlider--left-bottom {
            z-index: 1;
        }
        
        .ImageSlider--right-bottom {
            z-index: 1;
        }
        
        /* Animation keyframes - doubled duration for alternating behavior */
        @keyframes slideFromLeft {
            /* First loop: left image on top */
            0% { 
                transform: translateX(-100%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            12.5% { 
                transform: translateX(-50%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            25% { 
                transform: translateX(0%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            37.5% { 
                transform: translateX(50%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            50% { 
                transform: translateX(100%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            /* Second loop: left image behind */
            62.5% { 
                transform: translateX(-50%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            75% { 
                transform: translateX(0%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            87.5% { 
                transform: translateX(50%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            100% { 
                transform: translateX(100%); 
                clip-path: inset(5% 5% 5% 5%);
            }
        }
        
        @keyframes slideFromRight {
            /* First loop: right image behind */
            0% { 
                transform: translateX(100%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            12.5% { 
                transform: translateX(50%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            25% { 
                transform: translateX(0%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            37.5% { 
                transform: translateX(-50%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            50% { 
                transform: translateX(-100%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            /* Second loop: right image on top */
            62.5% { 
                transform: translateX(50%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            75% { 
                transform: translateX(0%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            87.5% { 
                transform: translateX(-50%); 
                clip-path: inset(5% 5% 5% 5%);
            }
            100% { 
                transform: translateX(-100%); 
                clip-path: inset(5% 5% 5% 5%);
            }
        }
        
        /* Info overlay */
        .info-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            z-index: 100;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        .info-overlay:hover {
            opacity: 1;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .controls button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            margin-left: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s ease;
        }
        
        .controls button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>
   <!--
    <div class="info-overlay">
        <div></div>
        <div style="font-size: 12px; margin-top: 4px;"></div>
    </div>
    <!--
    <div class="controls">
        <button onclick="changeSpeed(2)">Fast</button>
        <button onclick="changeSpeed(5)">Normal</button>
        <button onclick="changeSpeed(8)">Slow</button>
        <button onclick="togglePause()">Pause</button>
    </div>
    -->
    <script>
        // Configuration
        const config = {
            seconds: 5,
            edge: 5,
            bgColor: 'black',
            easing: 'ease-in-out'
        };
        
        // Pool of images from recent-assets; a random pair is picked on every page load
        const D = 'recent-assets/_edge/performances/desintegration-2026/2026_09_Mies van der Roche_Erika Landstroem_Fot. Joanna Wilk_Performance_';
        const imagePool = [
            ...Array.from({ length: 11 }, (_, i) => `${D}${i + 1} Large.jpeg`),
            ...['105 copy', '112 copy', '122_crop copy', '133-Recovered copy'].map(n => `recent-assets/_edge/performances/the-maze-2026/Maze at Adlon/Ordinary-tales-of-city-madness-adlon-${n}.jpg`),
            ...Array.from({ length: 10 }, (_, i) => `recent-assets/press/press-tvnet-2026/Pg${i + 1}.jpg`),
            'recent-assets/_edge/exhibitions/chb-2026/Buerhaus McGrath CHB copy/005-1.jpg',
            'recent-assets/_edge/exhibitions/chb-2026/Buerhaus McGrath CHB copy/0061.jpg',
            'recent-assets/_edge/exhibitions/program23-2026/NightsLikeThis_Documentation_Program23_StoogBerlinDE2026.jpg'
        ];

        function pickRandomPair(pool) {
            const i = Math.floor(Math.random() * pool.length);
            let j;
            do { j = Math.floor(Math.random() * pool.length); } while (j === i);
            return { L: encodeURI(pool[i]), R: encodeURI(pool[j]) };
        }

        const imageSets = {
            random: { name: 'Recent', images: pickRandomPair(imagePool) }
        };
        
        // State
        let state = {
            loops: 0,
            active: 'L',
            paused: false,
            currentSpeed: config.seconds
        };
        
        const currentSet = imageSets.random;
        document.title = `Edge Transfer (${currentSet.name})`;
        
        // DOM elements
        const root = document.getElementById('root');
        
        // Create clip path based on edge percentage
        function createClipPath(element, edgePercent) {
            const rect = element.getBoundingClientRect();
            const edge = (edgePercent / 100);
            const top = rect.height * edge;
            const right = rect.width - (rect.width * edge);
            const bottom = rect.height - (rect.height * edge);
            const left = rect.width * edge;
            return `rect(${top}px, ${right}px, ${bottom}px, ${left}px)`;
        }
        
        // Create DOM element from HTML string
        function createElement(htmlString) {
            const div = document.createElement('div');
            div.innerHTML = htmlString.trim();
            return div.firstChild;
        }
        
        // Create sliding image elements
        const sliders = {
            L: createElement(`
                <div class="ImageSlider ImageSlider--left" style="background-image: url(&quot;${currentSet.images.L}&quot;);"></div>
            `),
            R: createElement(`
                <div class="ImageSlider ImageSlider--right" style="background-image: url(&quot;${currentSet.images.R}&quot;);"></div>
            `)
        };
        
        // Set up clipping with proper edge values
        function updateClipping() {
            const clipValue = `inset(${config.edge}% ${config.edge}% ${config.edge}% ${config.edge}%)`;
            sliders.L.style.clipPath = clipValue;
            sliders.R.style.clipPath = clipValue;
        }
        
        // Append elements to DOM
        root.appendChild(sliders.L);
        root.appendChild(sliders.R);
        
        // Set background color
        document.body.style.backgroundColor = config.bgColor;
        
        // Initialize z-index alternating
        function setLayerOrder(leftOnTop) {
            if (leftOnTop) {
                sliders.L.className = 'ImageSlider ImageSlider--left ImageSlider--left-top';
                sliders.R.className = 'ImageSlider ImageSlider--right ImageSlider--right-bottom';
            } else {
                sliders.L.className = 'ImageSlider ImageSlider--left ImageSlider--left-bottom';
                sliders.R.className = 'ImageSlider ImageSlider--right ImageSlider--right-top';
            }
        }
        
        // Start with left image on top
        setLayerOrder(true);
        
        // Handle animation iterations to alternate z-index every loop
        let isLeftOnTop = true;
        
        // Listen to the left slider animation to track complete cycles
        sliders.L.addEventListener('animationiteration', function() {
            // Toggle which image is on top
            isLeftOnTop = !isLeftOnTop;
            setLayerOrder(isLeftOnTop);
        });
        
        // Initialize
        updateClipping();
        
        // Animation control functions
        function changeSpeed(seconds) {
            state.currentSpeed = seconds;
            // Double the duration since each animation cycle includes both loops
            const duration = `${seconds * 2}s`;
            sliders.L.style.animationDuration = duration;
            sliders.R.style.animationDuration = duration;
            
            // Update the CSS animation duration dynamically
            const style = document.createElement('style');
            style.textContent = `
                .ImageSlider--left { animation-duration: ${duration} !important; }
                .ImageSlider--right { animation-duration: ${duration} !important; }
            `;
            document.head.appendChild(style);
        }
        
        function togglePause() {
            state.paused = !state.paused;
            const playState = state.paused ? 'paused' : 'running';
            sliders.L.style.animationPlayState = playState;
            sliders.R.style.animationPlayState = playState;
            
            // Update button text
            const button = document.querySelector('.controls button:last-child');
            button.textContent = state.paused ? 'Resume' : 'Pause';
        }
        
        // Clicking the image opens "recent": dismiss the overlay when embedded, otherwise navigate
        root.addEventListener('click', function() {
            if (window.parent !== window) {
                window.parent.postMessage('edge-transfer-dismiss', '*');
            } else {
                window.location.href = 'recent.html';
            }
        });
        root.style.cursor = 'pointer';
        
        // Handle window resize
        window.addEventListener('resize', updateClipping);
        
        // Keyboard controls
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePause();
                    break;
                case '1':
                    changeSpeed(2);
                    break;
                case '2':
                    changeSpeed(5);
                    break;
                case '3':
                    changeSpeed(8);
                    break;
            }
        });
        
        // Switch between image sets (optional)
        function switchImageSet(setName) {
            if (imageSets[setName]) {
                sliders.L.style.backgroundImage = `url(${imageSets[setName].images.L})`;
                sliders.R.style.backgroundImage = `url(${imageSets[setName].images.R})`;
                document.title = `Edge Transfer (${imageSets[setName].name})`;
            }
        }
        
        console.log('Edge Transfer initialized');
        console.log('Controls: Spacebar = pause/resume, 1/2/3 = speed');
        console.log('Available image sets:', Object.keys(imageSets));
    </script>
</body>
</html>
